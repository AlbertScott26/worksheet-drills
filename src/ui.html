<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worksheet Drills</title>
<style>
:root{--bg:#141B36;--panel:#243058;--line:#3A4772;--gold:#C9A227;--cream:#E8E4D4;
--display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
--body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
--mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
body.idle #drill{cursor:none}
[hidden]{display:none!important}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;color:#fff;font-family:var(--body)}
.hl,.hr,.chip{position:absolute;top:54px;font:600 22px/1 var(--mono);letter-spacing:.08em}
.hl{left:96px}.hr{right:96px;text-align:right}
.rule{position:absolute;left:96px;right:96px;top:113px;height:3px;background:var(--gold)}
.foot{position:absolute;left:96px;bottom:34px;font:500 15px/1 var(--mono);letter-spacing:.08em;opacity:.75}
.foot.r{left:auto;right:96px}

/* ---------- start screen ---------- */
#drop{position:absolute;left:96px;right:96px;top:150px;height:330px;background:var(--panel);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:border-color .15s}
#drop.over{border-color:var(--gold)}
#drop .big{font:700 62px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
#drop .sm{font:400 28px/1.2 var(--body);color:var(--cream)}
#status{position:absolute;left:96px;right:96px;top:494px;height:34px;font:500 22px/34px var(--mono);letter-spacing:.04em;color:var(--cream)}
#pw{position:absolute;left:96px;right:96px;top:534px;height:8px;background:var(--panel);border:1px solid var(--line)}
#pf{height:100%;width:0;background:var(--gold);transition:width .2s}
#status.err{color:#fff;background:var(--panel);border-left:6px solid var(--gold);padding-left:14px}
.cards{position:absolute;left:96px;right:96px;top:548px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--panel);border:1px solid var(--line);padding:20px 26px;cursor:pointer;text-align:left;color:#fff;font-family:var(--body)}
.card.sel{border:3px solid var(--gold);padding:18px 24px}
.card .t{font:700 26px/1 var(--mono);letter-spacing:.06em;margin-bottom:10px}
.card .d{font:400 24px/1.3 var(--body);color:var(--cream)}
#acrbtn{position:absolute;right:96px;top:46px;font:600 16px/1 var(--mono);letter-spacing:.08em;color:#fff;background:var(--panel);border:1px solid var(--line);padding:12px 20px;cursor:pointer}
#resume{position:absolute;right:480px;top:46px;font:600 16px/1 var(--mono);letter-spacing:.08em;color:#fff;background:var(--panel);border:1px solid var(--line);padding:12px 20px;cursor:pointer}
.supp{position:absolute;left:96px;right:96px;bottom:70px;font:400 20px/1.5 var(--body);color:var(--cream);opacity:.9}

/* ---------- drill screen ---------- */
.chip{left:50%;transform:translateX(-50%);top:46px;font-size:17px;padding:11px 18px;background:var(--panel);color:#fff;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip.guided{border:2px solid var(--gold)}
.chip.walk{border:2px solid var(--cream)}
.rowwrap{position:absolute;left:96px;right:96px;top:130px;height:262px;display:flex;align-items:center;justify-content:center}
.row{display:inline-flex;align-items:center;gap:36px;transform-origin:center}
.nw{display:inline-flex;align-items:center;gap:.12em;font:700 120px/1 var(--body)}
.whole{font-size:1.18em;line-height:1}
.frac{display:inline-flex;flex-direction:column;align-items:center}
.frac .n{padding:0 .08em .03em;line-height:1}
.frac .d{border-top:.05em solid currentColor;padding:.03em .08em 0;line-height:1}
.eq{font:600 104px/1 var(--body);opacity:.9}
.eq.cm{font-size:80px;margin:0 -8px}
.slot{position:relative;display:inline-flex;align-items:center}
.ans{visibility:hidden;color:var(--gold)}
.slot.on .ans{visibility:visible}
.qm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 100px/1 var(--body);color:rgba(255,255,255,.28)}
.slot.on .qm{display:none}
.ptext{width:1400px;text-align:left;font:600 56px/1.25 var(--body);white-space:pre-wrap;word-break:break-word;max-height:250px;overflow:hidden}
.mk{background:var(--cream);color:var(--bg);border-radius:6px;padding:0 .14em;font-weight:700}
.ptext .ctx{display:block;font:400 .5em/1.3 var(--body);color:var(--cream);opacity:.85;margin-bottom:.35em;white-space:normal}

.steps{position:absolute;left:96px;right:96px;top:408px;bottom:72px;display:flex;flex-direction:column;gap:8px;--k:1}
.st{display:grid;grid-template-columns:44px 540px 1fr;column-gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px 18px 8px 14px}
.st.cur{border-left:6px solid var(--gold);padding-left:9px}
.st .no{font:700 24px/1 var(--mono);color:var(--gold)}
.st .work{font:600 calc(40px*var(--k))/1.2 var(--body)}
.st .why{font:400 calc(26px*var(--k))/1.25 var(--body);color:var(--cream)}
.steps.walk .st{grid-template-columns:44px 1fr}
.steps.walk .st .work{font-size:calc(46px*var(--k))}
.work b{color:var(--gold);font-weight:700}
.ifr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.78em;line-height:1.05;margin:0 .1em}
.ifr span:first-child{padding:0 .15em .04em}
.ifr span:last-child{border-top:.07em solid currentColor;padding:.04em .15em 0}
.imx{display:inline-flex;align-items:center;vertical-align:middle}
.imx .iw{font-size:1.1em;margin-right:.08em}
.board{position:absolute;left:96px;right:96px;top:404px;bottom:72px;display:flex;flex-direction:column;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:20px;--k:1}
.bl{font:600 calc(var(--bs,62px)*var(--k))/1.25 var(--body);text-align:center;opacity:.72}
.bl.cur{opacity:1;animation:rise .28s ease-out}
.bl b{color:var(--gold);font-weight:700}
.bl .ifr{font-size:.82em}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.board .waiting{padding-top:30px}
.waiting{font:400 30px/1.3 var(--body);color:var(--cream);opacity:.55;padding:6px 0}
#pic{position:absolute;left:96px;right:96px;top:134px;bottom:84px;display:flex;align-items:center;justify-content:center}
#pic .paper{background:#fff;padding:14px;border-radius:4px;max-width:100%;max-height:100%;display:flex}
#pic img{display:block;max-width:100%;max-height:100%;object-fit:contain}
#busy{position:absolute;left:0;top:0;width:1600px;height:900px;background:rgba(20,27,54,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:6}
#busy .bt{font:600 30px/1 var(--mono);letter-spacing:.06em}
#busy .bb{width:700px;height:10px;background:var(--panel);border:1px solid var(--line)}
#busyf{height:100%;width:0;background:var(--gold);transition:width .15s}
.prog{position:absolute;left:0;bottom:0;height:6px;background:var(--gold);transition:width .25s}
.nav{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:14px;opacity:0;transition:opacity .3s}
body.moved .nav{opacity:1}
body.moved #hint{display:none}
.nav button{font:600 16px/1 var(--mono);letter-spacing:.08em;color:#fff;background:var(--panel);border:1px solid var(--line);padding:12px 20px;cursor:pointer}
#hint{position:absolute;left:400px;right:240px;bottom:34px;text-align:center;white-space:nowrap;font:500 15px/1 var(--mono);letter-spacing:.06em;pointer-events:none;opacity:0}
#hint.show{animation:fade 11s forwards}
@keyframes fade{0%,70%{opacity:.85}100%{opacity:0}}
#goto{position:absolute;left:0;top:0;width:1600px;height:900px;background:rgba(20,27,54,.88);display:flex;align-items:center;justify-content:center;z-index:5}
#goto .box{background:var(--panel);border:2px solid var(--gold);padding:28px 40px;text-align:center}
#goto .lbl{font:600 20px/1 var(--mono);letter-spacing:.08em;margin-bottom:18px}
#goto input{width:220px;font:700 64px/1.1 var(--body);text-align:center;color:#fff;background:var(--bg);border:1px solid var(--line);padding:8px;user-select:text;-webkit-user-select:text}

/* ---------- home + generator ---------- */
.tb{position:absolute;top:46px;font:600 16px/1 var(--mono);letter-spacing:.08em;color:#fff;background:var(--panel);border:1px solid var(--line);padding:12px 20px;cursor:pointer}
#home .tiles{position:absolute;left:96px;right:96px;top:170px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.tile{background:var(--panel);border:1px solid var(--line);padding:44px 40px;height:520px;text-align:left;color:#fff;font-family:var(--body);cursor:pointer;display:flex;flex-direction:column}
.tile:hover,.tile:focus{border:3px solid var(--gold);padding:42px 38px;outline:none}
.tile .k{font:600 20px/1 var(--mono);letter-spacing:.1em;color:var(--cream);margin-bottom:26px}
.tile .t{font:700 60px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:28px}
.tile .d{font:400 29px/1.35 var(--body);color:var(--cream)}
.tile .go{margin-top:auto;font:700 22px/1 var(--mono);letter-spacing:.1em}
#gtabs{position:absolute;left:96px;right:96px;top:134px;display:flex;gap:12px}
#gtabs button,.opt button{font:600 20px/1 var(--mono);letter-spacing:.08em;color:#fff;background:var(--panel);border:1px solid var(--line);padding:14px 22px;cursor:pointer}
#gtabs button.sel,.opt button.sel{border:3px solid var(--gold);padding:12px 20px}
#gtopics,#gsubs{position:absolute;top:204px;bottom:112px;overflow-y:auto;background:var(--panel);border:1px solid var(--line)}
#gtopics{left:96px;width:430px}#gsubs{left:546px;right:96px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;min-height:52px;font:400 24px/1.15 var(--body);color:#fff;cursor:pointer;border-bottom:1px solid var(--line)}
.grow.sel{background:var(--bg);box-shadow:inset 6px 0 0 var(--gold)}
.grow .gn{font:600 16px/1 var(--mono);letter-spacing:.06em;color:var(--cream);white-space:nowrap}
.grow.soon{color:#9aa3c4}
.grow .rd{font:700 14px/1 var(--mono);letter-spacing:.1em;border:1px solid #fff;padding:5px 8px;color:#fff}
.grow.soon .rd{border-color:var(--line);color:#9aa3c4}
#gbar{position:absolute;left:96px;right:96px;bottom:20px;height:76px;display:flex;align-items:center;gap:26px}
#gbar .lab{font:600 15px/1 var(--mono);letter-spacing:.1em;color:var(--cream);margin-right:-12px}
.opt{display:flex;gap:8px}.opt button{padding:12px 16px;font-size:18px}.opt button.sel{padding:10px 14px}
#ggo{margin-left:auto;font:700 24px/1 var(--mono);letter-spacing:.1em;color:#fff;background:var(--panel);border:3px solid var(--gold);padding:18px 30px;cursor:pointer}
#ggo:disabled{border-color:var(--line);color:#9aa3c4;cursor:default}
#gmsg{position:absolute;left:96px;right:96px;bottom:2px;font:500 15px/1 var(--mono);letter-spacing:.04em;color:var(--cream);height:16px}
</style></head>
<body>
<div id="stage">

  <!-- START SCREEN -->
  <!-- HOME -->
  <div id="home">
    <div class="hl">TEACHER TOOLS</div>
    <div class="rule"></div>
    <div class="tiles">
      <button class="tile" id="tileWs">
        <div class="k">TOOL 1</div>
        <div class="t">Worksheet to Presentation</div>
        <div class="d">Drop any worksheet PDF. Get a one-problem-at-a-time presentation with steps, reasoning, and the answer revealed on the board.</div>
        <div class="go">OPEN &#9654;</div>
      </button>
      <button class="tile" id="tileGen">
        <div class="k">TOOL 2</div>
        <div class="t">Problem Generator</div>
        <div class="d">Pick a subject and topic from the K5 Learning grade 4 list. Fresh problems every time, presented with the same steps.</div>
        <div class="go">OPEN &#9654;</div>
      </button>
    </div>
    <div class="foot">PRESS 1 OR 2  &middot;  ESC RETURNS HERE</div>
  </div>

  <!-- GENERATOR -->
  <div id="gen" hidden>
    <div class="hl">PROBLEM GENERATOR</div>
    <button class="tb" id="genhome" style="right:96px">HOME</button>
    <div class="rule"></div>
    <div id="gtabs"></div>
    <div id="gtopics"></div>
    <div id="gsubs"></div>
    <div id="gbar">
      <span class="lab">PROBLEMS</span><div class="opt" id="gcount"></div>
      <span class="lab">LEVEL</span><div class="opt" id="glevel"></div>
      <button id="ggo">GENERATE &#9654;</button>
    </div>
    <div id="gmsg"></div>
  </div>

  <div id="start" hidden>
    <button class="tb" id="starthome" style="right:700px">HOME</button>
    <div class="hl">WORKSHEET DRILLS</div>
    <button id="resume" hidden>RESUME WORKSHEET</button>
    <button id="acrbtn"></button>
    <div class="rule"></div>
    <div id="drop">
      <div class="big">Drop a worksheet PDF here</div>
      <div class="sm">any subject &middot; or click to choose a file</div>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf,application/json,.json" hidden>
    <div id="status"></div>
    <div id="pw" hidden><div id="pf"></div></div>
    <div class="cards">
      <button class="card" id="cardGuided" data-mode="guided">
        <div class="t">GUIDED</div>
        <div class="d">Steps with brief reasoning. Use when a student is confused and needs the process explained.</div>
      </button>
      <button class="card" id="cardWalk" data-mode="walk">
        <div class="t">WALK-THROUGH</div>
        <div class="d">Steps only, no reasoning. Use when students explain the process and you reveal each step as they say it.</div>
      </button>
    </div>
  </div>

  <!-- DRILL SCREEN -->
  <div id="drill" hidden>
    <div class="hl" id="hl"></div>
    <button class="chip" id="chip"></button>
    <div class="hr" id="hr"></div>
    <div class="rule"></div>
    <div class="rowwrap"><div class="row" id="row"></div></div>
    <div id="pic" hidden></div>
    <div class="steps" id="steps"></div>
    <div id="hint"></div>
    <div class="foot" id="foot"></div>
    <div class="foot r" id="footr"></div>
    <div class="nav"><button id="bk">&#9664; BACK</button><button id="fw">NEXT STEP &#9654;</button></div>
    <div class="prog" id="prog"></div>
  </div>

  <div id="busy" hidden><div class="bt" id="busyt"></div><div class="bb"><div id="busyf"></div></div></div>

  <div id="goto" hidden>
    <div class="box"><div class="lbl">GO TO PROBLEM (1&ndash;<span id="gmax"></span>)</div><input id="gin" type="text" inputmode="numeric" autocomplete="off"></div>
  </div>
</div>

<!-- Embedded PDF reader (pdf.js, Apache-2.0). Kept as plain text and loaded on demand. -->
<script type="text/plain" id="pdfjs-lib">/*__PDFJS_LIB__*/</script>
<script type="text/plain" id="pdfjs-worker">/*__PDFJS_WORKER__*/</script>

<script>window.__PRELOAD__ = /*__PRELOAD__*/null; window.__LIBRARY__ = /*__LIBRARY__*/[];</script>
<script>/*__CORE__*/</script>
<script>/*__GEN__*/</script>
<script>window.__CATALOG__ = /*__CATALOG__*/null;</script>
<script>
(function(){
'use strict';
var C = window.DrillCore, GEN = window.DrillGen;
var $ = function(id){ return document.getElementById(id); };
var stage = $('stage');
var S = { origin: 'pdf', gen: null, data: null, i: 0, s: 0, mode: 'guided', layout: 'board', acr: true, acrSeen: {} };
var ACRONYMS = { GCF: 'Greatest common factor' };
try { var m = localStorage.getItem('fd-mode'); if (m === 'guided' || m === 'walk') S.mode = m; var ac = localStorage.getItem('fd-acr'); if (ac === '0') S.acr = false; var ly = localStorage.getItem('fd-layout'); if (ly === 'board' || ly === 'boxes') S.layout = ly; } catch (e) {}

/* ---------- layout scaling ---------- */
function fitStage(){
  var k = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = 'translate(' + (innerWidth - 1600 * k) / 2 + 'px,' + (innerHeight - 900 * k) / 2 + 'px) scale(' + k + ')';
}

/* ---------- mode ---------- */
function setMode(m){
  S.mode = m;
  try { localStorage.setItem('fd-mode', m); } catch (e) {}
  $('cardGuided').classList.toggle('sel', m === 'guided');
  $('cardWalk').classList.toggle('sel', m === 'walk');
  if (S.data && !$('drill').hidden) render();
}

/* ---------- PDF reading ---------- */
/* fill in features older Safari versions lack (pdf.js needs them) */
function polyfills(){
  try {
    if (typeof ReadableStream !== 'undefined' && !ReadableStream.prototype[Symbol.asyncIterator]) {
      var vals = function(){
        var r = this.getReader();
        return { next: function(){ return r.read(); }, 'return': function(){ try { r.releaseLock(); } catch (e) {} return Promise.resolve({ done: true, value: undefined }); }, [Symbol.asyncIterator]: function(){ return this; } };
      };
      ReadableStream.prototype[Symbol.asyncIterator] = vals;
      if (!ReadableStream.prototype.values) ReadableStream.prototype.values = vals;
    }
    if (!Promise.withResolvers) Promise.withResolvers = function(){ var o = {}; o.promise = new Promise(function(a, b){ o.resolve = a; o.reject = b; }); return o; };
    if (!Array.fromAsync) Array.fromAsync = async function(it){ var out = []; for await (var x of it) out.push(x); return out; };
    if (!Object.groupBy) Object.groupBy = function(it, f){ var o = Object.create(null), i = 0; for (var x of it) { var k = f(x, i++); (o[k] = o[k] || []).push(x); } return o; };
    if (!Array.prototype.at) Array.prototype.at = function(n){ n = Math.trunc(n) || 0; if (n < 0) n += this.length; return this[n]; };
    if (!Uint8Array.prototype.at) Uint8Array.prototype.at = Array.prototype.at;
    if (!Object.hasOwn) Object.hasOwn = function(o, k){ return Object.prototype.hasOwnProperty.call(o, k); };
  } catch (e) {}
}
var pdfjsP = null;
function loadPdfjs(){
  if (pdfjsP) return pdfjsP;
  pdfjsP = new Promise(function(resolve, reject){
    try {
      polyfills();
      // classic inline scripts: no module imports or Blob workers, which some browsers block on file://
      [$('pdfjs-lib').textContent, $('pdfjs-worker').textContent].forEach(function(code){
        var sc = document.createElement('script'); sc.text = code; document.head.appendChild(sc);
      });
      var lib = window.__pdfjsLib;
      if (!lib || !window.pdfjsWorker) throw new Error('The PDF reader did not start.');
      lib.GlobalWorkerOptions.workerSrc = 'about:blank';
      resolve(lib);
    } catch (e) { reject(e); }
  });
  pdfjsP.catch(function(){ pdfjsP = null; });
  return pdfjsP;
}

function status(msg, err){
  var el = $('status');
  el.textContent = msg || '';
  el.className = err ? 'err' : '';
  if (err || !msg) $('pw').hidden = true;
}

/* progress bar: shows percent and time left */
var PG = { t0: 0, last: 0, timer: null };
function progress(frac, label){
  var now = Date.now();
  if (!PG.t0) PG.t0 = now;
  PG.last = now;
  frac = Math.max(0, Math.min(1, frac));
  $('pw').hidden = false;
  $('pf').style.width = (frac * 100).toFixed(0) + '%';
  var left = '';
  if (frac > 0.2 && frac < 0.98) { var sec = Math.max(1, Math.ceil((now - PG.t0) / frac * (1 - frac) / 1000)); left = ' · about ' + sec + ' sec left'; }
  var el = $('status'); el.className = ''; el.textContent = label + ' · ' + Math.round(frac * 100) + '%' + left;
}
function progressStart(){
  PG.t0 = Date.now(); PG.last = PG.t0; clearInterval(PG.timer);
  PG.timer = setInterval(function(){
    if (Date.now() - PG.last > 20000) { clearInterval(PG.timer); PG.t0 = 0; status('This is taking too long. Reload the page and try again, or use Chrome.', true); }
  }, 1000);
}
function progressEnd(){ clearInterval(PG.timer); PG.t0 = 0; }
function tick(){ return new Promise(function(r){ setTimeout(r, 20); }); }

async function readFile(file){
  if (!file) return;
  var isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
  if (!isJson && !/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { status('Drop a PDF worksheet (or a .json lesson file).', true); return; }
  progressStart();
  try {
    if (isJson) {
      progress(0.3, 'Reading lesson'); await tick();
      var L = JSON.parse(await file.text());
      S.data = makeTextData(L.title || file.name.replace(/\.json$/i, ''), L.subject || 'LESSON', file.name, C.lessonToItems(L));
      S.i = 0; S.s = 0; S.acrSeen = {}; progressEnd(); status(''); showDrill(); return;
    }
    progress(0.03, 'Starting the PDF reader'); await tick();
    var pdfjs = await loadPdfjs();
    progress(0.15, 'Opening ' + file.name); await tick();
    var buf = new Uint8Array(await file.arrayBuffer());
    var doc = await pdfjs.getDocument({ data: buf, useSystemFonts: true }).promise;
    var kind = null, probs = [], sawText = false, pages = [], np = doc.numPages, parseErr = null;
    for (var p = 1; p <= np; p++) {
      progress(0.2 + 0.65 * (p - 1) / np, 'Reading page ' + p + ' of ' + np); await tick();
      var page = await doc.getPage(p);
      var tc = await page.getTextContent();
      var items = tc.items.map(function(t){ return { str: t.str, x: t.transform[4], y: t.transform[5], size: Math.hypot(t.transform[0], t.transform[1]), width: t.width }; });
      if (items.some(function(o){ return o.str && o.str.trim(); })) sawText = true;
      pages.push(items);
      var r;
      try { r = C.parsePage(items); } catch (pe) { parseErr = parseErr || pe; continue; }
      if (!r.kind) continue;
      if (kind && r.kind !== kind) throw new Error('This PDF mixes worksheet types. Split it into one type per file.');
      kind = r.kind;
      probs = probs.concat(r.problems);
    }
    if (!sawText) throw new Error('This PDF has no selectable text (it may be a scan). Upload it to Claude and ask for a lesson file (.json), then drop that here.');
    progress(0.9, 'Building questions'); await tick();
    S.doc = doc; S.pages = pages; S.textData = null; S.view = 'text'; S.imgData = null;
    var title = file.name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ');

    if (kind && probs.length) {
      S.data = makeData(kind, file.name, probs);
    } else {
      var g = C.parseGeneric(pages);
      if (!g.items.length) {
        progress(0.92, 'Preparing the original sheet'); await tick();
        var idata = await buildImageData(doc, pages, function(f, m){ progress(0.92 + 0.07 * f, m); });
        if (idata && idata.probs.length) { S.data = idata; S.view = 'image'; S.i = 0; S.s = 0; progress(1, 'Ready'); await tick(); progressEnd(); status(''); showDrill(); return; }
        if (parseErr) throw parseErr;
      }
      var lib = g.items.length ? C.matchLesson(window.__LIBRARY__, g.items) : null;
      if (!g.items.length) throw new Error('No numbered questions found. Upload it to Claude and ask for a lesson file (.json), then drop that here.');
      if (lib) {

        S.data = makeTextData(title, 'WORKSHEET', file.name, g.items.map(function(o){
          return { n: o.n, text: o.text, ctx: o.ctx, steps: o.answer ? [{ work: '<b>' + C.esc(o.answer).replace(/\n/g, '<br>') + '</b>', why: '' }] : [] };

    progressEnd(); status('');
    showDrill();
  } catch (e) {

  }
}

function makeTextData(title, label, file, items){
  return { kind: 'text', label: String(label).toUpperCase(), title: title, file: file,
    probs: items.map(function(it, idx){ return { n: it.n || idx + 1, text: it.text, ctx: it.ctx || '', slots: [], steps: it.steps || [] }; }) };
}

function makeData(kind, file, probs){
  var K = C.KINDS[kind];
  return {
    kind: kind, label: K.label, title: K.title, file: file,
    probs: probs.map(function(pr, idx){ var sv = C.solve(kind, pr.q); return { n: idx + 1, q: pr.q, row: sv.row, slots: sv.slots, steps: sv.steps, hdr: sv.hdr }; })

/* numbered cells ("1)" or "1.") found from label positions; answer page has the same layout */
function pageCells(labels, W, H){
  var ls = labels.slice().sort(function(a, b){ return b.y - a.y || a.x - b.x; }), rows = [];
  ls.forEach(function(l){ var r = rows.find(function(r){ return Math.abs(r.y - l.y) < 14; }); if (r) r.items.push(l); else rows.push({ y: l.y, items: [l] }); });
  rows.sort(function(a, b){ return b.y - a.y; });
  var out = [];
  rows.forEach(function(r, ri){
    r.items.sort(function(a, b){ return a.x - b.x; });
    var nxt = rows[ri + 1];
    r.items.forEach(function(l, ci){
      var nx = r.items[ci + 1];
      out.push({ n: l.n, x0: Math.max(0, l.x - 8), x1: nx ? nx.x - 8 : W - 24,
        yTop: Math.min(H, l.y + l.size + 8), yBot: nxt ? nxt.y + nxt.items[0].size + 8 : 36 });
    });
  });
  return out;
}

function inkBox(cv){

  var x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var i = (y * w + x) * 4;
    if (d[i + 3] > 20 && (d[i] < 235 || d[i + 1] < 235 || d[i + 2] < 235)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }

  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(src, Math.round(r.x), Math.round(r.y), Math.round(r.w), Math.round(r.h), 0, 0, c.width, c.height);
  return c;
}

async function buildImageData(doc, pages, report){

    var page = await doc.getPage(p + 1), vp = page.getViewport({ scale: 1 });
    var items = pages[p] || [];
    var labels = items.filter(function(o){ return /^\d{1,3}\s*[.)]$/.test(o.str.trim()) && o.size <= 16; })
      .map(function(o){ return { n: parseInt(o.str, 10), x: o.x, y: o.y, size: o.size }; });
    var isKey = items.some(function(o){ return /^answers?( key)?$/i.test(o.str.trim()); }) || (labels.length > 0 && labels.every(function(l){ return seen[l.n]; }));

  }
  var qPages = info.filter(function(i){ return !i.isKey; }), kPages = info.filter(function(i){ return i.isKey; });
  var labelled = qPages.reduce(function(a, i){ return a + i.labels.length; }, 0) >= 2;

    if (i.canvas) return i.canvas;
    var vp = i.page.getViewport({ scale: K }), cv = document.createElement('canvas');

    qPages.forEach(function(i){ pageCells(i.labels, i.W, i.H).forEach(function(c){ jobs.push({ n: c.n, q: { c: c, page: i }, a: keyCells[c.n] || null }); }); });
    jobs.sort(function(a, b){ return a.n - b.n; });
  } else {
    qPages.forEach(function(i, idx){
      var whole = { n: idx + 1, x0: 0, x1: i.W, yTop: i.H, yBot: 0 }, kp = kPages[idx];
      jobs.push({ n: idx + 1, q: { c: whole, page: i }, a: kp ? { c: whole, page: kp } : null });
    });
  }
  var probs = [];
  for (var j = 0; j < jobs.length; j++) {
    report(j / jobs.length, 'Preparing the original sheet'); await tick();
    var job = jobs[j], cq = await renderPage(job.q.page), rect = function(cell){ return { x: cell.c.x0 * K, y: (cell.page.H - cell.c.yTop) * K, w: (cell.c.x1 - cell.c.x0) * K, h: (cell.c.yTop - cell.c.yBot) * K }; };
    var rq = rect(job.q), qc = cropTo(cq, rq), ac = null;
    if (job.a) { var ca = await renderPage(job.a.page); ac = cropTo(ca, rect(job.a)); }
    var bq = inkBox(qc), ba = ac ? inkBox(ac) : null, b = bq;
    if (!bq) continue;
    var pad = 16, box = function(b, cv){ var r = { x: Math.max(0, b.x0 - pad), y: Math.max(0, b.y0 - pad) }; r.w = Math.min(cv.width, b.x1 + pad) - r.x; r.h = Math.min(cv.height, b.y1 + pad) - r.y; return r; };
    var same = ac && ac.width === qc.width && Math.abs(ac.height - qc.height) < qc.height * 0.15;   /* same layout: crop both identically so the answer lands in place */
    if (same && ba) b = { x0: Math.min(bq.x0, ba.x0), y0: Math.min(bq.y0, ba.y0), x1: Math.max(bq.x1, ba.x1), y1: Math.max(bq.y1, ba.y1) };
    var rq2 = box(b, qc), ra2 = same && ba ? rq2 : (ba ? box(ba, ac) : null);
    probs.push({ n: job.n, img: cropTo(qc, rq2).toDataURL('image/png'), ans: ac && ra2 ? cropTo(ac, ra2).toDataURL('image/png') : null, slots: [],
      steps: ac && ra2 ? [{ work: '', why: '' }] : [] });
  }
  report(1, 'Preparing the original sheet');
  info.forEach(function(i){ i.canvas = null; });
  return { kind: 'image', label: 'ORIGINAL SHEET', title: 'Original worksheet', file: '', probs: probs };
}

async function toggleImage(){

/* ---------- rendering ---------- */
function part(v){
  var h = '';
  if (v.sym) return '<span class="nw"><span class="whole">' + (v.sym === '<' ? '&lt;' : v.sym === '>' ? '&gt;' : '=') + '</span></span>';
  if (v.w != null) h += '<span class="whole">' + v.w + '</span>';
  if (v.num != null && v.den != null) h += '<span class="frac"><span class="n">' + v.num + '</span><span class="d">' + v.den + '</span></span>';
  return '<span class="nw">' + h + '</span>';
}

function expand(text, key){
  // first time an acronym is shown in a worksheet, spell it out once: "Greatest common factor (GCF)"
  if (!S.acr) return text;
  return text.replace(/\b([A-Z]{2,5})\b/, function(m, a){
    if (!ACRONYMS[a]) return m;
    var seen = S.acrSeen[a];
    if (!seen) { S.acrSeen[a] = key; seen = key; }
    return seen === key ? ACRONYMS[a] + ' (' + a + ')' : m;
  });
}
function render(){

  function slotHtml(k){

    return '<span class="slot' + (on ? ' on' : '') + '"><span class="ans">' + part(p.slots[k].v) + '</span><span class="qm">?</span></span>';
  }
  var h = '';
  if (p.text != null) {
    var marks = [];
    for (var mi = 0; mi < S.s; mi++) (p.steps[mi].mark || []).forEach(function(m){ marks.push(m); });
    var hlt = function(t){ var e = C.esc(t); marks.forEach(function(m){ var em = C.esc(m); if (em) e = e.split(em).join('<span class="mk">' + em + '</span>'); }); return e; };
    h = '<div class="ptext">' + (p.ctx ? '<span class="ctx">' + hlt(p.ctx) + '</span>' : '') + hlt(p.text) + '</div>';

  }
  var row = $('row');
  row.innerHTML = h;
  row.style.transform = 'none';
  if (p.text != null) {
    var pt = row.firstChild;
    for (var fs = p.text.length < 60 ? 72 : 56; fs > 22 && pt.scrollHeight > 252; fs -= 3) pt.style.fontSize = fs + 'px';
  } else {

  st.className = board ? 'board' : ('steps' + (guided ? '' : ' walk'));
  st.style.setProperty('--k', '1');

  else if (!p.steps.length) sh = '<div class="waiting">No answer on the sheet. Press → for the next question.</div>';
  for (var i = 0; i < S.s; i++) {

  $('hl').textContent = p.hdr || D.label;
  $('hr').textContent = '#' + (i0() + 1) + ' OF ' + N;
  $('foot').textContent = D.title.toUpperCase();
  $('footr').textContent = p.steps.length ? (p.text != null && p.steps.length === 1 ? (S.s ? 'ANSWER SHOWN' : 'ANSWER HIDDEN') : 'STEP ' + S.s + ' OF ' + p.steps.length) : 'NO ANSWER KEY';
  $('prog').style.width = ((S.i + (p.steps.length ? S.s / p.steps.length : 0)) / N * 100) + '%';

}
function renderImage(D, p, N){

function i0(){ return S.i; }

function fwd(){

var CAT = window.__CATALOG__, G = { si: 0, ti: 0, ui: 0, count: 10, level: 0, focus: 'subs' };
function subList(){
  var sj = CAT.subjects[G.si], names = Object.keys(sj.topics), tn = names[G.ti];
  return { sj: sj, names: names, tn: tn, subs: sj.topics[tn].map(function(x){ var p = x.split('|'); return { title: p[0], slug: p[1] || null, cov: p[1] ? GEN.COVERAGE[p[1]] : null }; }) };
}
function readyCount(sj, tn){ return sj.topics[tn].filter(function(x){ var p = x.split('|'); return p[1] && GEN.COVERAGE[p[1]]; }).length; }
function mk(tag, cls, txt, fn){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (fn) e.addEventListener('click', function(ev){ ev.stopPropagation(); fn(); }); return e; }

  var L = subList(), tabs = $('gtabs'), tp = $('gtopics'), sb = $('gsubs');
  tabs.innerHTML = ''; tp.innerHTML = ''; sb.innerHTML = '';
  CAT.subjects.forEach(function(sj, i){ var b = mk('button', i === G.si ? 'sel' : '', sj.name.toUpperCase(), function(){ G.si = i; G.ti = 0; G.ui = 0; drawGen(); }); tabs.appendChild(b); });
  L.names.forEach(function(n, i){

  });

  if (f) readFile(f);
});
$('cardGuided').addEventListener('click', function(){ setMode('guided'); });
$('cardWalk').addEventListener('click', function(){ setMode('walk'); });
function acrLabel(){ $('acrbtn').textContent = S.acr ? 'ACRONYMS: SPELL OUT FIRST USE' : 'ACRONYMS: SHORT ONLY'; }
$('acrbtn').addEventListener('click', function(){ S.acr = !S.acr; S.acrSeen = {}; try { localStorage.setItem('fd-acr', S.acr ? '1' : '0'); } catch (e) {} acrLabel(); });
acrLabel();
$('resume').addEventListener('click', showDrill);
$('chip').addEventListener('click', function(e){ e.stopPropagation(); setMode(S.mode === 'guided' ? 'walk' : 'guided'); });
$('fw').addEventListener('click', function(e){ e.stopPropagation(); fwd(); });
$('bk').addEventListener('click', function(e){ e.stopPropagation(); back(); });
$('drill').addEventListener('click', fwd);

function openGoto(){
  $('gmax').textContent = S.data.probs.length;
  $('goto').hidden = false;
  var inp = $('gin'); inp.value = ''; inp.focus();
}
function closeGoto(){ $('goto').hidden = true; $('gin').blur(); }

document.addEventListener('keydown', function(e){
  var k = e.key;
  if (!$('goto').hidden) {
    if (k === 'Enter') { var n = parseInt($('gin').value, 10); closeGoto(); if (n > 0) go(n - 1); }
    else if (k === 'Escape') closeGoto();
    return;
  }
  if (!$('home').hidden) {
    if (k === '1') { S.origin = 'pdf'; showStart(); } else if (k === '2') showGen();
    return;
  }
  if (!$('gen').hidden) {
    var L = subList();
    if (k === 'Escape') showHome();
    else if (k === 'ArrowDown') { e.preventDefault(); G.ui = Math.min(L.subs.length - 1, G.ui + 1); drawGen(); }
    else if (k === 'ArrowUp') { e.preventDefault(); G.ui = Math.max(0, G.ui - 1); drawGen(); }
    else if (k === 'ArrowRight') { e.preventDefault(); if (G.ti < L.names.length - 1) { G.ti++; G.ui = 0; drawGen(); } }
    else if (k === 'ArrowLeft') { e.preventDefault(); if (G.ti > 0) { G.ti--; G.ui = 0; drawGen(); } }
    else if (k === 'Tab') { e.preventDefault(); G.si = (G.si + (e.shiftKey ? CAT.subjects.length - 1 : 1)) % CAT.subjects.length; G.ti = 0; G.ui = 0; drawGen(); }
    else if (k === 'Enter') { e.preventDefault(); startGen(); }
    return;
  }
  if (!$('start').hidden) {
    if (k === 'm' || k === 'M') setMode(S.mode === 'guided' ? 'walk' : 'guided');
    else if (k === 'Escape') showHome();
    return;
  }
  if ([' ', 'Enter', 'ArrowRight', 'ArrowDown', 'PageDown', 'n'].indexOf(k) >= 0) { e.preventDefault(); fwd(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p'].indexOf(k) >= 0) { e.preventDefault(); back(); }
  else if (k === 'm' || k === 'M') setMode(S.mode === 'guided' ? 'walk' : 'guided');
  else if (k === 'o' || k === 'O') { toggleImage(); }
  else if (k === 'r' || k === 'R') { regen(); }
  else if (k === 'l' || k === 'L') { S.layout = S.layout === 'board' ? 'boxes' : 'board'; try { localStorage.setItem('fd-layout', S.layout); } catch (er) {} render(); }
  else if (k === 'g' || k === 'G') { e.preventDefault(); openGoto(); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(S.data.probs.length - 1); S.s = S.data.probs[S.i].steps.length; render(); }
  else if (k === 'f' || k === 'F') {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (er) {}
  }
  else if (k === 'Escape') { if (!document.fullscreenElement) { if (S.origin === 'gen') showGen(); else showStart(); } }
});

var idleT;
document.addEventListener('mousemove', function(){
  document.body.classList.add('moved'); document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(function(){ document.body.classList.remove('moved'); document.body.classList.add('idle'); }, 2500);
});
addEventListener('resize', function(){ fitStage(); if (S.data && !$('drill').hidden) render(); });

fitStage();
setMode(S.mode);
if (window.__PRELOAD__) {
  try {
    var L = window.__PRELOAD__;
    S.data = makeData(L.kind, L.file || '', L.probs);
    S.i = 0; S.s = 0; S.acrSeen = {};
    showDrill();
  } catch (e) { status('Could not open the built-in worksheet: ' + e.message, true); }
}
// test hook: lets automated checks read state
window.__fd = S; S.G = G; S.startGen = startGen;
})();
</script>
